name: MetaBlooms Repo Manifest

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/metablooms-repo-manifest.yml'
      - 'tools/metablooms/github_repo_manifest_generator_v1.py'
      - 'governance/github_os_sync/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/metablooms-repo-manifest.yml'
      - 'tools/metablooms/github_repo_manifest_generator_v1.py'
      - 'governance/github_os_sync/**'

permissions:
  contents: read
  actions: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
      - name: Record checked-out Git ref
        run: |
          git rev-parse HEAD > github_checkout_head.txt
          git status --short > github_checkout_status.txt
      - name: Generate repository manifest
        run: |
          python3 tools/metablooms/github_repo_manifest_generator_v1.py \
            --root . \
            --output github_main_manifest.tsv \
            --receipt github_manifest_receipt.json \
            --exclude github_checkout_head.txt \
            --exclude github_checkout_status.txt
          sha256sum github_main_manifest.tsv github_manifest_receipt.json github_checkout_head.txt > github_manifest_outputs.sha256
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: metablooms-github-main-manifest-${{ github.sha }}
          path: |
            github_main_manifest.tsv
            github_main_manifest.tsv.sha256
            github_manifest_receipt.json
            github_manifest_outputs.sha256
            github_checkout_head.txt
            github_checkout_status.txt
          if-no-files-found: error
          retention-days: 30
