name: MetaBlooms Release Audit Harness with GitHub Attestation

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: "Path to release ZIP, ZIP.ZST, TAR, or TAR.ZST inside the checked-out repository. Optional. If empty, sticky release is audited."
        required: false
        default: ""
      release_tag:
        description: "GitHub Release tag containing the artifact asset. Defaults to current sticky release."
        required: false
        default: "MB-FULL-STICKY-RECEIPT-KEY-SELFVERIFY-20260601T2251Z"
      release_asset_name:
        description: "GitHub Release asset name to download and audit. Defaults to current sticky TAR.ZST release."
        required: false
        default: "METABLOOMS_FULL_OS_STICKY_AFTER_RECEIPT_KEY_SELFVERIFY_20260601T2251Z.tar.zst"
      expected_root:
        description: "Expected root directory inside release artifact."
        required: false
        default: "Metablooms_OS"
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "metablooms-release-*"

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  audit-and-attest:
    name: Audit release artifact and attest audit packet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEFAULT_RELEASE_TAG: MB-FULL-STICKY-RECEIPT-KEY-SELFVERIFY-20260601T2251Z
      DEFAULT_RELEASE_ASSET_NAME: METABLOOMS_FULL_OS_STICKY_AFTER_RECEIPT_KEY_SELFVERIFY_20260601T2251Z.tar.zst
      DEFAULT_EXPECTED_ROOT: Metablooms_OS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd zip unzip python3 curl

      - name: Locate harness
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f runtime/cartridges/release_audit_harness_v1/release_audit_harness_runner_v1.py ]; then
            echo "runner=runtime/cartridges/release_audit_harness_v1/release_audit_harness_runner_v1.py" >> "$GITHUB_OUTPUT"
          elif [ -f Metablooms_OS/runtime/cartridges/release_audit_harness_v1/release_audit_harness_runner_v1.py ]; then
            echo "runner=Metablooms_OS/runtime/cartridges/release_audit_harness_v1/release_audit_harness_runner_v1.py" >> "$GITHUB_OUTPUT"
          else
            echo "release audit harness runner missing" >&2
            exit 41
          fi

      - name: Run bounded negative fixture self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 -S "${{ steps.locate.outputs.runner }}" --self-test --out-dir remote_self_test --clean

      - name: Resolve artifact source
        id: resolve-artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_asset_download remote_audit_out
          ARTIFACT_PATH="${{ github.event.inputs.artifact_path || '' }}"
          RELEASE_TAG="${{ github.event.inputs.release_tag || '' }}"
          RELEASE_ASSET_NAME="${{ github.event.inputs.release_asset_name || '' }}"
          if [ -z "$ARTIFACT_PATH" ] && [ -z "$RELEASE_TAG" ] && [ -z "$RELEASE_ASSET_NAME" ]; then
            RELEASE_TAG="$DEFAULT_RELEASE_TAG"
            RELEASE_ASSET_NAME="$DEFAULT_RELEASE_ASSET_NAME"
            echo "No explicit artifact inputs supplied; defaulting to sticky release $RELEASE_TAG / $RELEASE_ASSET_NAME"
          fi
          if [ -n "$RELEASE_TAG" ] && [ -n "$RELEASE_ASSET_NAME" ]; then
            BASE_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
            curl -fL --retry 3 --retry-delay 2 -o "release_asset_download/$RELEASE_ASSET_NAME" "$BASE_URL/$RELEASE_ASSET_NAME"
            curl -fL --retry 3 --retry-delay 2 -o "release_asset_download/$RELEASE_ASSET_NAME.sha256" "$BASE_URL/$RELEASE_ASSET_NAME.sha256"
            ARTIFACT_PATH="release_asset_download/$RELEASE_ASSET_NAME"
            test -f "$ARTIFACT_PATH"
            test -f "$ARTIFACT_PATH.sha256"
            echo "resolved_release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "resolved_release_asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$ARTIFACT_PATH" ]; then
            echo "BLOCKED: no artifact path and no release tag/asset available. Refusing silent Stage6 fallback." >&2
            exit 42
          fi
          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "resolved_artifact_path=$ARTIFACT_PATH"

      - name: Audit release artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_PATH="${{ steps.resolve-artifact.outputs.artifact_path }}"
          EXPECTED_ROOT="${{ github.event.inputs.expected_root || '' }}"
          if [ -z "$EXPECTED_ROOT" ]; then EXPECTED_ROOT="$DEFAULT_EXPECTED_ROOT"; fi
          python3 -S "${{ steps.locate.outputs.runner }}" \
            --artifact "$ARTIFACT_PATH" \
            --expected-root "$EXPECTED_ROOT" \
            --out-dir remote_audit_out \
            --clean
          sha256sum remote_audit_out/audit_packet.zip > remote_audit_out/audit_packet.zip.sha256

      - name: Upload audit packet
        id: upload-audit-packet
        uses: actions/upload-artifact@v4
        with:
          name: metablooms-release-audit-packet
          path: |
            remote_audit_out/audit_packet.zip
            remote_audit_out/audit_packet.zip.sha256
            remote_audit_out/audit_result.json
            remote_audit_out/audit_report.md
            remote_self_test/self_test_result.json
          retention-days: 14
          if-no-files-found: error

      - name: Generate GitHub artifact attestation for audit packet
        uses: actions/attest@v4
        with:
          subject-path: remote_audit_out/audit_packet.zip

      - name: Verify GitHub artifact attestation for audit packet
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify remote_audit_out/audit_packet.zip -R "${{ github.repository }}"

      - name: Write remote CI summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# MetaBlooms Release Audit Harness"
            echo
            echo "- Repository: ${{ github.repository }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Artifact path: ${{ steps.resolve-artifact.outputs.artifact_path }}"
            echo "- Release tag: ${{ steps.resolve-artifact.outputs.resolved_release_tag }}"
            echo "- Release asset: ${{ steps.resolve-artifact.outputs.resolved_release_asset_name }}"
            echo "- Artifact upload digest: ${{ steps.upload-audit-packet.outputs.digest }}"
            echo "- Attestation verification: completed by gh attestation verify"
            echo
            cat remote_audit_out/audit_report.md || true
          } >> "$GITHUB_STEP_SUMMARY"
